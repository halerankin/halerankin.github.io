<svg width="1400" height="560" viewBox="0 0 1400 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SVG System: From Design to Consumption</title>
  <desc id="desc">Six-stage system diagram with flat chevron arrows and a segmented feedback loop.</desc>

  <defs>
    <style>
      .frame { fill: #14171C; stroke: #2A2F36; stroke-width: 1.5; }
      .box { fill: #181C22; stroke: #2F3540; stroke-width: 1.5; }
      .boxEmphasis { fill: #1D222A; stroke: #4A5563; stroke-width: 1.5; }

      .textPrimary { fill: #E6EAF0; font: 600 18px Inter, sans-serif; }
      .textSecondary { fill: #AAB2BF; font: 400 14px Inter, sans-serif; }
      .textMeta { fill: #7E8794; font: 600 10px Inter, sans-serif; letter-spacing: 1px; text-transform: uppercase; }

      .title { fill: #F3F5F7; font: 700 30px Inter, sans-serif; }
      .eyebrow { fill: #8A93A0; font: 600 11px Inter, sans-serif; letter-spacing: 1.5px; text-transform: uppercase; }

      .chevron { fill: #2C333D; }
      .chevronAccent { fill: #3A424E; }

      .feedback { stroke: #6B7280; stroke-width: 1.5; stroke-dasharray: 6 8; fill: none; stroke-linecap: round; }
      .feedbackLabel { fill: #9CA3AF; font: 400 13px Inter, sans-serif; }
    </style>
  </defs>

  <!-- Frame -->
  <rect class="frame" x="40" y="40" width="1320" height="480" rx="12"/>

  <!-- Header -->
  <text x="80" y="90" class="eyebrow">Turning static assets into a system</text>
  <text x="80" y="130" class="title">SVG System: From Design to Consumption</text>

  <!-- Boxes -->
  <!-- Stage 01 -->
  <rect class="box" x="80" y="200" width="180" height="160" rx="10"/>
  <text x="100" y="230" class="textMeta">Stage 01</text>
  <text x="100" y="260" class="textPrimary">Design Source</text>
  <text x="100" y="290" class="textSecondary">Figma + SVG export</text>

  <!-- Stage 02 -->
  <rect class="box" x="280" y="200" width="180" height="160" rx="10"/>
  <text x="300" y="230" class="textMeta">Stage 02</text>
  <text x="300" y="260" class="textPrimary">SVG Processing</text>
  <text x="300" y="290" class="textSecondary">
    <tspan x="300" dy="0">Optimize, normalize,</tspan>
    <tspan x="300" dy="20">validate</tspan>
  </text>

  <!-- Stage 03 -->
  <rect class="boxEmphasis" x="480" y="190" width="180" height="180" rx="10"/>
  <text x="500" y="220" class="textMeta">Stage 03</text>
  <text x="500" y="250" class="textPrimary">Presentation Layer</text>
  <text x="500" y="280" class="textSecondary">
    <tspan x="500">TypeScript icon</tspan>
    <tspan x="500" dy="20">component</tspan>
  </text>

  <!-- Stage 04 -->
  <rect class="boxEmphasis" x="680" y="190" width="180" height="180" rx="10"/>
  <text x="700" y="220" class="textMeta">Stage 04</text>
  <text x="700" y="250" class="textPrimary">Icon Gallery</text>
  <text x="700" y="280" class="textSecondary">
    <tspan x="700">Searchable shared</tspan>
    <tspan x="700" dy="20">reference</tspan>
  </text>

  <!-- Stage 05 -->
  <rect class="box" x="880" y="200" width="180" height="160" rx="10"/>
  <text x="900" y="230" class="textMeta">Stage 05</text>
  <text x="900" y="260" class="textPrimary">Packaging</text>
  <text x="900" y="290" class="textSecondary">
    <tspan x="900">Versioned delivery</tspan>
    <tspan x="900" dy="20">+ CI/CD</tspan>
  </text>

  <!-- Stage 06 -->
  <rect class="box" x="1080" y="200" width="180" height="160" rx="10"/>
  <text x="1100" y="230" class="textMeta">Stage 06</text>
  <text x="1100" y="260" class="textPrimary">Product Usage</text>
  <text x="1100" y="290" class="textSecondary">
    <tspan x="1100">Internal + external</tspan>
    <tspan x="1100" dy="20">teams</tspan>
  </text>

  <!-- Chevron arrows -->
  <polygon class="chevron" points="260,260 280,275 260,290"/>
  <polygon class="chevron" points="460,260 480,275 460,290"/>
  <polygon class="chevronAccent" points="660,260 680,275 660,290"/>
  <polygon class="chevronAccent" points="860,260 880,275 860,290"/>
  <polygon class="chevron" points="1060,260 1080,275 1060,290"/>

  <!-- Feedback label -->
  <text x="160" y="440" class="feedbackLabel">New assets / gaps / naming feedback</text>

  <!-- Segmented feedback loop -->
  <path
  d="M1226 372 
     V430 
     Q1226 450 1218 450 
     H140 
     Q120 450 100 450 
     V370"
  stroke="#6B7280"
  stroke-width="2"
  stroke-dasharray="6 8"
  stroke-linecap="round"
  fill="none"
/>

</svg>